name: Trustline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  trustmap:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when MODEL_API_KEY is unavailable
        id: access
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "MODEL_API_KEY is not available (fork pull requests do not receive repo secrets). Skipping Trustline. This is not a failure."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.access.outputs.skip == 'false'
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        if: steps.access.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Install Trustline
        if: steps.access.outputs.skip == 'false'
        run: uv sync --group dev

      - name: Added-line diff
        if: steps.access.outputs.skip == 'false'
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run python -m scanner.ci write-added-diff --base "$BASE" --head "$HEAD" --out "$RUNNER_TEMP/added.diff" --full-out "$RUNNER_TEMP/pr.diff"
          uv run python -m scanner.ci write-prompt --diff-file "$RUNNER_TEMP/added.diff" --out "$RUNNER_TEMP/prompt.txt"
          uv run python -m scanner.ci write-schema --out "$RUNNER_TEMP/findings.schema.json"
          if uv run python -m scanner.ci has-candidates --diff-file "$RUNNER_TEMP/added.diff"; then
            echo "candidates=true" >> "$GITHUB_OUTPUT"
          else
            echo "candidates=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"findings":[],"notes":"No HTTP(S) or s3:// references in added lines."}' > "$RUNNER_TEMP/findings.json"
          fi

      - name: Empty findings comment
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m scanner.ci comment --in-file "$RUNNER_TEMP/findings.json" --out "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"

      - name: Install Muse Code
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        run: |
          # install.sh is bash (`[[`); Ubuntu /bin/sh is dash and dies with
          # "[[: not found", which then hits `|| die "refusing to install into $dir"`.
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          export MUSE_INSTALL_DIR="$HOME/.local/bin"
          curl -fsSL https://dev.meta.ai/install.sh -o "$RUNNER_TEMP/muse-install.sh"
          bash "$RUNNER_TEMP/muse-install.sh"
          muse --version
          echo "MUSE_BIN=$(command -v muse)" >> "$GITHUB_ENV"

      - name: Muse settings and argv
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/muse-home/.config/muse"
          PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          echo "TRUSTMAP_PYTHON=$PYTHON" >> "$GITHUB_ENV"
          uv run python -m scanner.ci write-settings --python "$PYTHON" --cache-db "$RUNNER_TEMP/trustmap.db" --out "$RUNNER_TEMP/muse-home/.config/muse/settings.json"
          uv run python -m scanner.ci write-muse-argv --muse-bin "${MUSE_BIN:-muse}" --prompt-file "$RUNNER_TEMP/prompt.txt" --schema-file "$RUNNER_TEMP/findings.schema.json" --out "$RUNNER_TEMP/muse-argv.json"

      - name: muse exec from empty directory
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_API_KEY: ${{ secrets.MODEL_API_KEY }}
          TRUSTMAP_CACHE_DB: ${{ runner.temp }}/trustmap.db
        run: |
          "$TRUSTMAP_PYTHON" - <<'PY'
          import json, os, subprocess, sys, tempfile
          from scanner.ci import redact_ci_text

          argv = json.loads(
              open(os.environ["RUNNER_TEMP"] + "/muse-argv.json", encoding="utf-8").read()
          )
          if "--yolo" in argv:
              sys.exit("refusing to run muse with --yolo")
          muse_bin = os.environ.get("MUSE_BIN") or argv[0]
          argv[0] = muse_bin
          muse_home = os.path.join(os.environ["RUNNER_TEMP"], "muse-home")
          env = os.environ.copy()
          env["HOME"] = muse_home
          env["XDG_CONFIG_HOME"] = os.path.join(muse_home, ".config")
          env["MUSE_NO_AUTO_UPDATE"] = "1"
          empty = tempfile.mkdtemp()
          try:
              proc = subprocess.run(
                  argv, cwd=empty, env=env, capture_output=True, text=True
              )
              code = proc.returncode
              out = proc.stdout or ""
              if proc.stderr:
                  out += ("\n" if out else "") + proc.stderr
          except FileNotFoundError as exc:
              code = 1
              out = f"muse executable not found: {exc}\nPATH={env.get('PATH', '')}\n"
          dest = os.path.join(os.environ["RUNNER_TEMP"], "muse.out")
          open(dest, "w", encoding="utf-8").write(out)
          if code != 0:
              print("muse exec failed; redacted muse.out follows")
              print(redact_ci_text(out))
              print("--- muse --version ---")
              subprocess.run([muse_bin, "--version"], check=False)
              print("--- muse exec --help ---")
              subprocess.run([muse_bin, "exec", "--help"], check=False)
          raise SystemExit(code)
          PY

      - name: Validate JSON and comment
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTMAP_CACHE_DB: ${{ runner.temp }}/trustmap.db
        run: |
          uv run python -m scanner.ci parse --in-file "$RUNNER_TEMP/muse.out" --out "$RUNNER_TEMP/findings.json"
          uv run python -m scanner.ci comment --in-file "$RUNNER_TEMP/findings.json" --diff-file "$RUNNER_TEMP/pr.diff" --out "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"

      - name: Fail only on critical
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        env:
          TRUSTMAP_CACHE_DB: ${{ runner.temp }}/trustmap.db
        run: uv run python -m scanner.ci gate --diff-file "$RUNNER_TEMP/pr.diff"
