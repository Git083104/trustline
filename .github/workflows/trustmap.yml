name: Trustmap

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  trustmap:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when MODEL_API_KEY is unavailable
        id: access
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "MODEL_API_KEY is not available (fork pull requests do not receive repo secrets). Skipping Trustmap. This is not a failure."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.access.outputs.skip == 'false'
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        if: steps.access.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Install Trustmap
        if: steps.access.outputs.skip == 'false'
        run: uv sync --group dev

      - name: Added-line diff
        if: steps.access.outputs.skip == 'false'
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run python -m scanner.ci write-added-diff --base "$BASE" --head "$HEAD" --out "$RUNNER_TEMP/added.diff"
          uv run python -m scanner.ci write-prompt --diff-file "$RUNNER_TEMP/added.diff" --out "$RUNNER_TEMP/prompt.txt"
          uv run python -m scanner.ci write-schema --out "$RUNNER_TEMP/findings.schema.json"
          if uv run python -m scanner.ci has-candidates --diff-file "$RUNNER_TEMP/added.diff"; then
            echo "candidates=true" >> "$GITHUB_OUTPUT"
          else
            echo "candidates=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"findings":[],"notes":"No HTTP(S) or s3:// references in added lines."}' > "$RUNNER_TEMP/findings.json"
          fi

      - name: Empty findings comment
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m scanner.ci comment --in-file "$RUNNER_TEMP/findings.json" --out "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"

      - name: Install Muse Code
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Muse settings and argv
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/muse-home/.config/muse"
          PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          echo "TRUSTMAP_PYTHON=$PYTHON" >> "$GITHUB_ENV"
          uv run python -m scanner.ci write-settings --python "$PYTHON" --out "$RUNNER_TEMP/muse-home/.config/muse/settings.json"
          uv run python -m scanner.ci write-muse-argv --prompt-file "$RUNNER_TEMP/prompt.txt" --schema-file "$RUNNER_TEMP/findings.schema.json" --out "$RUNNER_TEMP/muse-argv.json"

      - name: muse exec from empty directory
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        env:
          HOME: ${{ runner.temp }}/muse-home
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          "$TRUSTMAP_PYTHON" - <<'PY'
          import json, os, subprocess, sys, tempfile
          argv = json.loads(
              open(os.environ["RUNNER_TEMP"] + "/muse-argv.json", encoding="utf-8").read()
          )
          if "--yolo" in argv:
              sys.exit("refusing to run muse with --yolo")
          empty = tempfile.mkdtemp()
          proc = subprocess.run(argv, cwd=empty, capture_output=True, text=True)
          out = proc.stdout or ""
          if proc.stderr:
              out += ("\n" if out else "") + proc.stderr
          open(os.environ["RUNNER_TEMP"] + "/muse.out", "w", encoding="utf-8").write(out)
          raise SystemExit(proc.returncode)
          PY

      - name: Validate JSON and comment
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m scanner.ci parse --in-file "$RUNNER_TEMP/muse.out" --out "$RUNNER_TEMP/findings.json"
          uv run python -m scanner.ci comment --in-file "$RUNNER_TEMP/findings.json" --out "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"

      - name: Fail only on critical
        if: steps.access.outputs.skip == 'false' && steps.diff.outputs.candidates == 'true'
        run: uv run python -m scanner.ci gate --in-file "$RUNNER_TEMP/findings.json"
