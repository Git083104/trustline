<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tether</title>
  <meta name="description" content="Find the parts of your code a stranger could take over.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="sheet">

<div id="page-home">
  <header class="row">
    <div class="cell title-cell span-5">
      <h1><img class="logo" src="/static/logo.svg" alt="" width="64" height="64">Tether</h1>
      <p class="tagline">Find the parts of your code a stranger could take over.</p>
    </div>
  </header>
  <form class="row form-row" id="scan-form" autocomplete="off" novalidate>
    <div class="cell input-cell span-4">
      <label class="sr" for="target">GitHub repository or website to scan</label>
      <input id="target" name="target" type="text" inputmode="url" spellcheck="false" placeholder="github.com/owner/repo or https://site.com">
      <span id="kind-chip" class="kind-chip" hidden></span>
      <p id="home-error" class="inline-error" role="alert" hidden></p>
    </div>
    <div class="cell scan-cell">
      <button class="scan" id="scan-btn" type="submit" disabled><span id="scan-label">Scan</span><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M6 24 24 6M10 6h14v14" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
  </form>
  <div class="row">
    <div class="cell span-5">
      <button type="button" class="btn" data-demo>Watch the demo</button>
    </div>
  </div>
  <section class="row" id="repos" aria-label="Repos to try">
    <div class="cell span-5">
      <h2 class="repos-title">Repos to try</h2>
      <div id="repos-list" class="dr-list-inline"></div>
    </div>
  </section>
</div>

<div id="page-app" hidden>
  <div class="row">
    <div class="cell span-5 app-bar">
      <button type="button" class="btn" data-home>Tether</button>
      <button type="button" class="btn" data-home>New scan</button>
    </div>
  </div>
  <p id="app-error" class="inline-error" role="alert" hidden></p>

  <section id="screen-scanning" hidden>
    <div class="row">
      <div class="cell span-5 scan-top">
        <span id="scan-target" class="mono"></span>
        <span id="scan-kind" hidden></span>
        <span id="scan-recorded" hidden></span>
        <span id="scan-clock" aria-live="polite">0:00</span>
        <span id="calls-used" class="mono">Agent calls 0</span>
        <span class="mono">Muse Spark</span>
        <button type="button" id="skip-report" class="btn" disabled>Skip to report</button>
      </div>
    </div>
    <section class="row art-row" aria-label="Layers">
      <div class="cell stack-cell span-3" data-scan="idle">
        <div class="stack">
          <svg viewBox="0 0 368 452" role="img" aria-label="Five stacked layers">
            <defs>
              <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="matrix(1 .5 -1 .5 0 0)">
                <circle cx="1.5" cy="1.5" r=".9" fill="#F3F2EE" opacity=".38"/>
              </pattern>
            </defs>
            <g class="slab" data-layer="5" data-state="pending"><polygon class="side" points="20,383 130,438 130,448 20,393"/><polygon class="side" points="130,438 240,383 240,393 130,448"/><polygon class="top" points="130,328 240,383 130,438 20,383"/><polygon class="tex" points="130,328 240,383 130,438 20,383"/></g>
            <g class="slab" data-layer="4" data-state="pending"><polygon class="side" points="20,305 130,360 130,370 20,315"/><polygon class="side" points="130,360 240,305 240,315 130,370"/><polygon class="top" points="130,250 240,305 130,360 20,305"/><polygon class="tex" points="130,250 240,305 130,360 20,305"/></g>
            <g class="slab" data-layer="3" data-state="pending"><polygon class="side" points="20,227 130,282 130,292 20,237"/><polygon class="side" points="130,282 240,227 240,237 130,292"/><polygon class="top" points="130,172 240,227 130,282 20,227"/><polygon class="tex" points="130,172 240,227 130,282 20,227"/></g>
            <g class="slab" data-layer="2" data-state="pending"><polygon class="side" points="20,149 130,204 130,214 20,159"/><polygon class="side" points="130,204 240,149 240,159 130,214"/><polygon class="top" points="130,94 240,149 130,204 20,149"/><polygon class="tex" points="130,94 240,149 130,204 20,149"/></g>
            <g class="slab" data-layer="1" data-state="pending"><polygon class="side" points="20,71 130,126 130,136 20,81"/><polygon class="side" points="130,126 240,71 240,81 130,136"/><polygon class="top" points="130,16 240,71 130,126 20,71"/><polygon class="tex" points="130,16 240,71 130,126 20,71"/></g>
            <line class="leader" x1="252" y1="71" x2="364" y2="71"/>
            <line class="leader" x1="252" y1="149" x2="364" y2="149"/>
            <line class="leader" x1="252" y1="227" x2="364" y2="227"/>
            <line class="leader" x1="252" y1="305" x2="364" y2="305"/>
            <line class="leader" x1="252" y1="383" x2="364" y2="383"/>
          </svg>
          <ol class="stack-list" id="stack-list">
            <li data-layer="1" data-state="pending" style="top:71px"><span class="sl-n">01</span><span class="sl-name">Gather</span><span class="sl-st layer-count" data-count="find">0</span></li>
            <li data-layer="2" data-state="pending" style="top:149px"><span class="sl-n">02</span><span class="sl-name">Classify</span><span class="sl-st layer-count" data-count="check">0</span></li>
            <li data-layer="3" data-state="pending" style="top:227px"><span class="sl-n">03</span><span class="sl-name">Investigate</span><span class="sl-st layer-count" data-count="investigate">0</span></li>
            <li data-layer="4" data-state="pending" style="top:305px"><span class="sl-n">04</span><span class="sl-name">Reason</span><span class="sl-st layer-count" data-count="rank">0</span></li>
            <li data-layer="5" data-state="pending" style="top:383px"><span class="sl-n">05</span><span class="sl-name">Report</span><span class="sl-st layer-count" data-count="report">0</span></li>
          </ol>
        </div>
      </div>
      <div class="cell tray-cell span-2">
        <div class="files" id="files"></div>
        <p class="files-cap mono" id="files-cap"></p>
      </div>
    </section>
    <div class="row">
      <div class="cell span-5">
        <div id="feed" class="feed"></div>
      </div>
    </div>
  </section>

  <section id="screen-results" hidden>
    <div class="row">
      <div class="cell span-5">
        <div class="res-top mono">
          <span id="res-target"></span>
          <span id="res-kind" hidden></span>
          <span id="res-recorded" hidden></span>
        </div>
        <h2 id="res-headline" class="verdict"></h2>
        <div id="res-chips" class="res-chips"></div>
        <div id="res-meta" class="res-meta"></div>
        <p id="partial-banner" class="partial-banner" hidden></p>
      </div>
    </div>
    <div class="row">
      <div class="cell span-5">
        <div id="tab-fix" class="tab-panel findings-list" role="tabpanel" aria-labelledby="tab-btn-fix"></div>
        <button type="button" id="work-toggle" class="btn work-toggle" aria-expanded="false" aria-controls="work-panel">Show the work</button>
        <div id="work-panel" hidden>
          <div class="tablist" role="tablist" aria-label="Report views">
            <button type="button" class="tab" role="tab" id="tab-btn-fix" data-tab="fix" aria-selected="true" aria-controls="tab-fix">Fix first <span id="tab-n-fix" class="tab-n mono"></span></button>
            <button type="button" class="tab" role="tab" id="tab-btn-all" data-tab="all" aria-selected="false" aria-controls="tab-all">All targets <span id="tab-n-all" class="tab-n mono"></span></button>
            <button type="button" class="tab" role="tab" id="tab-btn-trace" data-tab="trace" aria-selected="false" aria-controls="tab-trace">Agent trace <span id="tab-n-trace" class="tab-n mono"></span></button>
            <button type="button" class="tab" role="tab" id="tab-btn-raw" data-tab="raw" aria-selected="false" aria-controls="tab-raw">Raw JSON</button>
          </div>
          <div id="tab-all" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-all" hidden></div>
          <div id="tab-trace" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-trace" hidden></div>
          <div id="tab-raw" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-raw" hidden></div>
        </div>
      </div>
    </div>
  </section>
</div>

</main>
<script src="/static/app.js"></script>
<script type="module" src="/static/figure.js"></script>
</body>
</html>
