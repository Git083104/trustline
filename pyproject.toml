[project]
name = "trustmap"
version = "0.1.0"
description = "Find abandoned outside infrastructure a repository still trusts."
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.9.1",
    "httpx>=0.28.1",
    "openai>=2.0.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "tldextract>=5.4.0",
]

[project.scripts]
trustmap = "scanner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: live network tests",
]
